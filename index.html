  @keyframes drop {

  }

  .tile {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 40px;
    min-height: 200px;
    padding: 22px;
    color: var(--tile-ink);
    text-decoration: none;
    background: var(--c);
    border: 3px solid var(--line);
    border-radius: 24px;
    box-shadow: 7px 7px 0 var(--line);
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }
  .tile:hover { transform: translate(4px, 4px); box-shadow: 3px 3px 0 var(--line); }
  .tile:active { transform: translate(7px, 7px); box-shadow: 0 0 0 var(--line); }
  .tile:focus-visible { outline: 4px solid var(--ink); outline-offset: 4px; }

  .tile .top { display: flex; align-items: center; justify-content: space-between; }

  .icon {
    display: grid;
    place-items: center;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: var(--paper);
    border: 3px solid var(--tile-ink);
    color: var(--tile-ink);
  }
  .icon svg { width: 28px; height: 28px; fill: currentColor; stroke: none; }
  .go svg { width: 28px; height: 28px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

  .name {
    display: block;
    font-family: var(--display);
    font-size: 2rem;
    line-height: 1.05;
  }
  .handle {
    display: block;
    margin-top: 6px;
    font-weight: 700;
    font-size: 0.975rem;
    overflow-wrap: anywhere;
  }

  .tile.twitch {
    --c: var(--twitch);
    --tile-ink: #ffffff;
    grid-column: 1 / -1;
    flex-direction: row;
    align-items: center;
    min-height: 0;
    gap: 22px;
    padding: 28px;
  }
  .tile.twitch .icon { width: 72px; height: 72px; background: #ffffff; border-color: #ffffff; flex: none; }
  .tile.twitch .icon svg { width: 40px; height: 40px; }
  .tile.twitch .text { flex: 1; min-width: 0; }
  .tile.twitch .name { font-size: clamp(2.25rem, 7vw, 3.75rem); }
  .tile.twitch .handle { font-size: 1.125rem; }
  .tile.twitch .go svg { width: 40px; height: 40px; }

  .tile.youtube { --c: var(--youtube); }
  .tile.tiktok  { --c: var(--tiktok); }
  .tile.steam   { --c: var(--steam); }

  footer {
    margin-top: 56px;
    color: var(--muted);
    font-size: 0.9375rem;
  }

  @media (max-width: 720px) {
    .links { grid-template-columns: 1fr; gap: 18px; }
    .tile { min-height: 0; gap: 28px; box-shadow: 6px 6px 0 var(--line); }
    .tile.twitch { gap: 16px; padding: 22px; }
    .tile.twitch .icon { width: 56px; height: 56px; }
    .tile.twitch .icon svg { width: 32px; height: 32px; }
    .tile.twitch .go svg { width: 30px; height: 30px; }
  }

  @media (prefers-reduced-motion: reduce) {
    h1 .ch { animation: none; }
    .tile { transition: none; }
  }
</style>
