<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kutkat5 – Twitch, YouTube, TikTok & Steam</title>
<meta name="description" content="Find Kutkat5 on Twitch, YouTube, TikTok and Steam.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Figtree:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #efe8ff;
    --ink: #1a1033;
    --line: #1a1033;
    --muted: #4a3d6e;
    --accent: #7c4dff;

    --twitch: #7c4dff;
    --youtube: #ff6a5c;
    --tiktok: #3fe0b0;
    --steam: #ffd43b;

    --tile-ink: #1a1033;
    --paper: #ffffff;

    --display: "Bagel Fat One", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
    --body: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;

    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #150d28;
      --ink: #f3edff;
      --line: #f3edff;
      --muted: #b9acd9;
      --accent: #a78bff;
    }
  }
  :root[data-theme="dark"] {
    --bg: #150d28;
    --ink: #f3edff;
    --line: #f3edff;
    --muted: #b9acd9;
    --accent: #a78bff;
  }

  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--body);
    font-weight: 500;
    font-size: 1.0625rem;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  main {
    position: relative;
    z-index: 1;
    max-width: 960px;
    margin: 0 auto;
    padding: clamp(40px, 9vw, 96px) 24px 48px;
  }

  /* ---------- Hero ---------- */
  .hero { margin-bottom: clamp(36px, 7vw, 64px); }

  h1 {
    margin: 0;
    font-family: var(--display);
    font-weight: 400;
    font-size: clamp(3.75rem, 18vw, 10rem);
    line-height: 0.95;
    letter-spacing: -0.01em;
    text-shadow: 0.045em 0.045em 0 var(--accent);
  }
  h1 .ch {
    display: inline-block;
    animation:
      drop 0.7s cubic-bezier(0.3, 1.5, 0.5, 1) backwards,
      wave 3.6s ease-in-out infinite;
    animation-delay: calc(var(--i) * 70ms), calc(1.5s + var(--i) * 140ms);
  }
  h1 .hop { display: inline-block; cursor: default; }
  h1 .hop.go { animation: hop 0.55s cubic-bezier(0.3, 1.6, 0.5, 1); }
  @keyframes drop {
    from { transform: translateY(-0.9em) rotate(-8deg); opacity: 0; }
    to   { transform: none; opacity: 1; }
  }
  @keyframes wave {
    0%, 55%, 100% { transform: none; }
    28% { transform: translateY(-0.06em) rotate(-3deg); }
  }
  @keyframes hop {
    0%, 100% { transform: none; }
    40% { transform: translateY(-0.22em) rotate(8deg) scale(1.08); }
  }

  .hero p {
    margin: 22px 0 0;
    max-width: 34ch;
    color: var(--muted);
    font-size: 1.1875rem;
  }

  /* ---------- Link tiles ---------- */
  .links {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    list-style: none;
    margin: 0;
    padding: 0;
  }

  .tile {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 40px;
    min-height: 200px;
    padding: 22px;
    color: var(--tile-ink);
    text-decoration: none;
    background: var(--c);
    border: 3px solid var(--line);
    border-radius: 24px;
    box-shadow: 7px 7px 0 var(--line);
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }
  .tile:hover { transform: translate(4px, 4px); box-shadow: 3px 3px 0 var(--line); }
  .tile:active { transform: translate(7px, 7px); box-shadow: 0 0 0 var(--line); }
  .tile:focus-visible { outline: 4px solid var(--ink); outline-offset: 4px; }

  .tile .top { display: flex; align-items: center; justify-content: space-between; }

  .icon {
    display: grid;
    place-items: center;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: var(--paper);
    border: 3px solid var(--tile-ink);
    color: var(--tile-ink);
  }
  .icon svg { width: 28px; height: 28px; fill: currentColor; stroke: none; }
  .go svg { width: 28px; height: 28px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

  .name {
    display: block;
    font-family: var(--display);
    font-size: 2rem;
    line-height: 1.05;
  }
  .handle {
    display: block;
    margin-top: 6px;
    font-weight: 700;
    font-size: 0.975rem;
    overflow-wrap: anywhere;
  }

  /* Twitch is the main link: full width, horizontal */
  .tile.twitch {
    --c: var(--twitch);
    --tile-ink: #ffffff;
    grid-column: 1 / -1;
    flex-direction: row;
    align-items: center;
    min-height: 0;
    gap: 22px;
    padding: 28px;
  }
  .tile.twitch .icon { width: 72px; height: 72px; background: #ffffff; border-color: #ffffff; flex: none; }
  .tile.twitch .icon svg { width: 40px; height: 40px; }
  .tile.twitch .text { flex: 1; min-width: 0; }
  .tile.twitch .name { font-size: clamp(2.25rem, 7vw, 3.75rem); }
  .tile.twitch .handle { font-size: 1.125rem; }
  .tile.twitch .go svg { width: 40px; height: 40px; }

  .tile.youtube { --c: var(--youtube); }
  .tile.tiktok  { --c: var(--tiktok); }
  .tile.steam   { --c: var(--steam); }

  footer {
    margin-top: 56px;
    color: var(--muted);
    font-size: 0.9375rem;
  }

  /* ---------- Small screens ---------- */
  @media (max-width: 720px) {
    .links { grid-template-columns: 1fr; gap: 18px; }
    .tile { min-height: 0; gap: 28px; box-shadow: 6px 6px 0 var(--line); }
    .tile.twitch { gap: 14px; padding: 20px; }
    .tile.twitch .name { font-size: clamp(1.75rem, 8vw, 2.25rem); }
    .tile.twitch .handle { font-size: 0.95rem; overflow-wrap: normal; }
    .tile.twitch .icon { width: 56px; height: 56px; }
    .tile.twitch .icon svg { width: 32px; height: 32px; }
    .tile.twitch .go svg { width: 28px; height: 28px; }
  }


  /* ---------- Fun motion ---------- */
  .tile { animation: pop 0.7s cubic-bezier(0.3, 1.6, 0.5, 1) backwards; animation-delay: calc(0.75s + var(--n, 0) * 120ms); }
  @keyframes pop {
    from { transform: scale(0.6) rotate(-5deg); opacity: 0; }
    to   { transform: none; opacity: 1; }
  }

  .icon { transition: transform 0.25s cubic-bezier(0.3, 1.6, 0.5, 1); }
  .tile:hover .icon, .tile:focus-visible .icon { transform: rotate(-14deg) scale(1.14); }
  .go svg { transition: transform 0.2s ease; }
  .tile:hover .go svg, .tile:focus-visible .go svg { transform: translateX(6px); }

  .tile.twitch .icon svg { animation: wiggle 5s ease-in-out 2.5s infinite; }
  @keyframes wiggle {
    0%, 12%, 100% { transform: none; }
    3%  { transform: rotate(-12deg) scale(1.08); }
    6%  { transform: rotate(10deg) scale(1.08); }
    9%  { transform: rotate(-6deg); }
  }

  .floaters { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
  .floaters i {
    position: absolute;
    display: block;
    border: 3px solid var(--line);
    animation: float var(--d, 10s) ease-in-out var(--dl, 0s) infinite alternate;
  }
  @keyframes float {
    from { transform: translateY(0) rotate(var(--r, 0deg)); }
    to   { transform: translateY(-26px) rotate(calc(var(--r, 0deg) + 35deg)); }
  }
  .f1 { width: 46px; height: 46px; border-radius: 50%; background: var(--steam); top: 9%; right: 9%; --d: 9s; }
  .f2 { width: 38px; height: 38px; border-radius: 10px; background: var(--youtube); top: 26%; right: 4%; --r: 12deg; --d: 11s; --dl: -3s; }
  .f3 { width: 34px; height: 34px; border-radius: 50%; background: var(--tiktok); bottom: 12%; left: 4%; --d: 12s; --dl: -5s; }
  .f4 { width: 42px; height: 42px; border-radius: 12px; background: var(--twitch); bottom: 26%; right: 5%; --r: -10deg; --d: 10s; --dl: -2s; }
  .f5 { width: 26px; height: 26px; border-radius: 8px; background: var(--steam); top: 58%; left: 2.5%; --r: 20deg; --d: 8s; --dl: -6s; }

  @media (max-width: 1150px) { .floaters .f4 { display: none; } }
  @media (max-width: 720px) {
    .f1 { width: 30px; height: 30px; top: 2.5%; right: 6%; }
    .f2 { width: 26px; height: 26px; top: 2.5%; right: 22%; }
    .floaters .f3, .floaters .f4, .floaters .f5 { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .floaters { display: none; }
  }
</style>
</head>

<script>
  document.querySelectorAll('h1 .ch').forEach(function (ch) {
    var hop = ch.firstElementChild;
    function go() { hop.classList.remove('go'); void hop.offsetWidth; hop.classList.add('go'); }
    ch.addEventListener('pointerenter', go);
    ch.addEventListener('click', go);
    hop.addEventListener('animationend', function () { hop.classList.remove('go'); });
  });
